                size:
                  type: integer
                  format: int64
                  description: 文件大小（字节）
                last_modified:
                  type: integer
                  format: int64
                mime_type:
                  type: string
                policy_id:
                  type: string
                  description: 存储策略 HashID
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                entity_type:
                  type: string

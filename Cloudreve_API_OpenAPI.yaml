openapi: 3.0.3
info:
  title: Cloudreve v4 REST API
  version: "4.0.0"
  description: |
    Cloudreve 是一个开源云存储/网盘后端系统。本规范基于 Cloudreve v4 源码自动整理。
    
    - **基础路径**: `/api/v4`
    - **所有 ID** 均为 HashID 编码（字符串），不是数字
    - **鉴权方式**: JWT Bearer Token / Session Cookie / HMAC Sign
    
    更多信息见: https://github.com/cloudreve/Cloudreve
servers:
  - url: https://your-cloudreve-site.com/api/v4
    description: 替换为你的 Cloudreve 服务器地址

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        使用 `/session/token` 接口登录后获取的 access_token。
        Header: `Authorization: Bearer <token>`
    SessionAuth:
      type: apiKey
      in: cookie
      name: session
    BasicAuth:
      type: http
      scheme: basic
      description: WebDAV Basic Auth，用户名 + WebDAV 密码

  schemas:
    Response:
      type: object
      properties:
        code:
          type: integer
          description: 0=成功，非0=错误码
        msg:
          type: string
        data:
          nullable: true
        error:
          type: string
          description: 底层错误详情（仅开发模式）
        correlation_id:
          type: string
          format: uuid
      example:
        code: 0
        msg: ""
        data: {}

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 40021
        msg:
          type: string
          example: "User not found"
        error:
          type: string
          example: "sql: no rows"
        correlation_id:
          type: string
          format: uuid

    Token:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."
        refresh_token:
          type: string
          example: "dGhpcyBpcyBhIHJlZnJl..."
        access_expires:
          type: string
          format: date-time
        refresh_expires:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          description: HashID 编码的用户 ID
        email:
          type: string
          format: email
        nick:
          type: string
        avatar:
          type: string
          format: url
        status:
          type: integer
        created_at:
          type: string
          format: date-time

    BuiltinLoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          $ref: '#/components/schemas/Token'

    FileResponse:
      type: object
      properties:
        type:
          type: integer
          description: 1=文件, 2=目录
        id:
          type: string
          description: HashID 编码的文件 ID
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties:
            type: string
        path:
          type: string
          description: 文件 URI 路径
        shared:
          type: boolean
        owned:
          type: boolean
        primary_entity:
          type: string

    ListResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileResponse'
        parent:
          $ref: '#/components/schemas/FileResponse'
        pagination:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer
        context_hint:
          type: string
          format: uuid
          description: 后续请求的上下文提示
        mixed_type:
          type: boolean

    StoragePolicy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        max_size:
          type: integer
          format: int64
        allowed_suffix:
          type: array
          items:
            type: string
        denied_suffix:
          type: array
          items:
            type: string
        encryption:
          type: boolean
        chunk_concurrency:
          type: integer

    UploadSessionResponse:
      type: object
      properties:
        session_id:
          type: string
        upload_id:
          type: string
        chunk_size:
          type: integer
          format: int64
        expires:
          type: integer
          format: int64
          description: Unix 时间戳
        upload_urls:
          type: array
          items:
            type: string
        credential:
          type: string
        ak:
          type: string
        uri:
          type: string
        callback_secret:
          type: string
        mime_type:
          type: string
        storage_policy:
          $ref: '#/components/schemas/StoragePolicy'

    Share:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: url
        visited:
          type: integer
        downloaded:
          type: integer
        expired:
          type: boolean
        unlocked:
          type: boolean
        password_protected:
          type: boolean
        source_uri:
          type: string
        expires:
          type: string
          format: date-time
        size:
          type: integer
          format: int64

    FileURLResponse:
      type: object
      properties:
        urls:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: url
              entity_id:
                type: string
        expires:
          type: string
          format: date-time

    FileWithUrlResponse:
      allOf:
        - $ref: '#/components/schemas/FileResponse'
        - type: object
          properties:
            urls:
              type: array
              description: 临时下载/预览 URL，仅文件类型附带
              items:
                type: object
                properties:
                  url:
                    type: string
                    format: url
                  stream_saver_display_name:
                    type: string

    ListFileUrlResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileWithUrlResponse'
        pagination:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer
        expires:
          type: string
          format: date-time
          description: 本页所有 URL 中最早的过期时间

    FileRecommendResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileWithUrlResponse'
        expires:
          type: string
          format: date-time
          description: 所有 URL 中最早的过期时间

security:
  - BearerAuth: []

paths:
  # ============ 站点 ============
  /site/ping:
    get:
      tags: [站点]
      summary: 健康检查
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /site/captcha:
    get:
      tags: [站点]
      summary: 获取验证码图片
      responses:
        '200':
          description: 验证码图片
          content:
            image/png:
              schema:
                type: string
                format: binary

  /site/config/{section}:
    get:
      tags: [站点]
      summary: 获取站点配置
      parameters:
        - in: path
          name: section
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 站点配置 JSON

  # ============ 鉴权 ============
  /session/prepare:
    get:
      tags: [鉴权]
      summary: 登录预检查（返回用户是否支持密码/WebAuthn）
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /session/token:
    post:
      tags: [鉴权]
      summary: 用户登录获取 Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 4
                  maxLength: 128
      responses:
        '200':
          description: |
            code=0: 登录成功，返回 Token 对
            code=203: 需要 2FA，data 为 2FA 会话 ID
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/BuiltinLoginResponse'
                          - type: string
                            description: 2FA 会话 ID

    delete:
      tags: [鉴权]
      summary: 退出登录（撤销 Refresh Token）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK

  /session/token/2fa:
    post:
      tags: [鉴权]
      summary: 两步验证
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp, session_id]
              properties:
                otp:
                  type: string
                  description: TOTP 6 位验证码
                session_id:
                  type: string
                  description: 登录接口返回的 2FA 会话 ID
      responses:
        '200':
          description: 成功返回 Token 对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /session/token/refresh:
    post:
      tags: [鉴权]
      summary: 刷新 Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: 新的 Token 对
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Token'

  /session/authn:
    put:
      tags: [鉴权]
      summary: WebAuthn 登录准备
      security: []
      responses:
        '200':
          description: WebAuthn PublicKeyCredentialRequestOptions
    post:
      tags: [鉴权]
      summary: WebAuthn 登录完成
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 成功返回 Token 对

  # ============ 用户 ============
  /user:
    post:
      tags: [用户]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                language:
                  type: string
      responses:
        '200':
          description: 注册结果

  /user/reset:
    post:
      tags: [用户]
      summary: 发送密码重置邮件
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                language:
                  type: string
      responses:
        '200':
          description: OK

  /user/reset/{id}:
    patch:
      tags: [用户]
      summary: 重置密码
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, secret]
              properties:
                password:
                  type: string
                  minLength: 6
                secret:
                  type: string
      responses:
        '200':
          description: OK

  /user/activate/{id}:
    get:
      tags: [用户]
      summary: 邮件激活账户
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 激活结果

  /user/info/{id}:
    get:
      tags: [用户]
      summary: 获取用户公开信息
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 用户信息

  /user/avatar/{id}:
    get:
      tags: [用户]
      summary: 获取用户头像
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 头像图片

  # ============ 需登录用户信息 ============
  /user/me:
    get:
      tags: [用户]
      summary: 获取当前登录用户信息
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'

  /user/capacity:
    get:
      tags: [用户]
      summary: 获取存储容量使用情况
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 存储容量信息

  /user/setting:
    get:
      tags: [用户]
      summary: 获取用户个人设置
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 用户设置
    patch:
      tags: [用户]
      summary: 修改用户设置
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nick:
                  type: string
                language:
                  type: string
                theme:
                  type: string
      responses:
        '200':
          description: OK

  /user/setting/2fa:
    get:
      tags: [用户]
      summary: 初始化二步验证
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 返回 TOTP secret 和 QR 码

  # ============ 文件操作 ============
  /file:
    get:
      tags: [文件]
      summary: 列出目录文件
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: uri
          required: true
          schema:
            type: string
          description: |
            目录 URI，必须使用 `cloudreve://` 协议格式。我的文件根目录为
            `cloudreve://my/`，子目录如 `cloudreve://my/docs`；分享内容为
            `cloudreve://s/{share_id}/...`。不能传普通路径（如 `/`）或留空。
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: page_size
          schema:
            type: integer
        - in: query
          name: order_by
          schema:
            type: string
        - in: query
          name: order_direction
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: 文件列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ListResponse'

    delete:
      tags: [文件]
      summary: 删除文件（到回收站）
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uris]
              properties:
                uris:
                  type: array
                  items:
                    type: string
                unlink:
                  type: boolean
                  description: 物理删除
                skip_soft_delete:
                  type: boolean
      responses:
        '200':
          description: OK

  /file/info:
    get:
      tags: [文件]
      summary: 获取文件/目录信息
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: uri
          schema:
            type: string
          description: 文件 URI（cloudreve:// 协议格式，如 cloudreve://my/file.txt；与 id 二选一）
        - in: query
          name: id
          schema:
            type: string
          description: HashID 编码的文件 ID
        - in: query
          name: extended
          schema:
            type: boolean
          description: 返回扩展信息
        - in: query
          name: folder_summary
          schema:
            type: boolean
      responses:
        '200':
          description: 文件详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/FileResponse'

  /file/create:
    post:
      tags: [文件]
      summary: 创建空白文件或目录
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uri, type]
              properties:
                uri:
                  type: string
                  description: 目标 URI（cloudreve:// 协议格式，如 cloudreve://my/new-folder）
                type:
                  type: string
                  enum: [file, folder]
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                err_on_conflict:
                  type: boolean
      responses:
        '200':
          description: 创建结果

  /file/rename:
    post:
      tags: [文件]
      summary: 重命名
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uri, new_name]
              properties:
                uri:
                  type: string
                new_name:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '200':
          description: 重命名后的文件

  /file/move:
    post:
      tags: [文件]
      summary: 移动或复制文件
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uris, dst]
              properties:
                uris:
                  type: array
                  minItems: 1
                  items:
                    type: string
                dst:
                  type: string
                  description: 目标目录 URI
                copy:
                  type: boolean
      responses:
        '200':
          description: OK

  /file/url:
    post:
      tags: [文件]
      summary: 获取下载/预览 URL
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uris]
              properties:
                uris:
                  type: array
                  items:
                    type: string
                download:
                  type: boolean
                redirect:
                  type: boolean
                  description: 302 重定向（仅 URI 数量=1）
                entity:
                  type: string
                  description: 指定 Entity ID
                use_primary_site_url:
                  type: boolean
                skip_error:
                  type: boolean
                archive:
                  type: boolean
                  description: 打包下载
                no_cache:
                  type: boolean
      responses:
        '200':
          description: 临时下载 URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/FileURLResponse'

  /file/list:
    get:
      tags: [文件]
      summary: 分页文件列表（每项附带下载 URL）
      description: |
        分页列出目录内容，仅返回文件（不返回目录）。当前分页内的目录会被递归展开为
        其下所有层级的文件，一并返回。每个文件 item 额外附带与 POST /file/url 相同
        格式的临时下载/预览 URL；单个文件取 URL 失败时该项不带 urls，不影响整页。
        pagination 反映目录顶层条目（文件 + 目录）的分页信息，因此返回的 files 数量
        可能超过 page_size。单个目录遍历失败时跳过该目录，不影响其余结果。
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: uri
          required: true
          schema:
            type: string
          description: |
            目录 URI，必须使用 `cloudreve://` 协议格式。我的文件根目录为
            `cloudreve://my/`，子目录如 `cloudreve://my/docs`。
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: page_size
          schema:
            type: integer
        - in: query
          name: order_by
          schema:
            type: string
        - in: query
          name: order_direction
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: next_page_token
          schema:
            type: string
        - in: query
          name: download
          schema:
            type: boolean
          description: 下载模式（影响 Content-Disposition），默认 false 为预览模式
        - in: query
          name: no_cache
          schema:
            type: boolean
      responses:
        '200':
          description: 附带临时 URL 的分页文件列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ListFileUrlResponse'

  /file/recommend:
    get:
      tags: [文件]
      summary: 随机推荐文件
      description: |
        从指定目录中随机抽取文件返回，item 结构与 /file/list 一致（文件信息 + urls）。
        仅返回文件类型：候选集中出现的目录会被递归展开为其下所有层级的文件，再与
        直接文件一起随机抽取；每次请求结果随机。实现上先取一个较大的候选集
        （count × 5，上限为导航器最大页大小）并递归展开目录，再打乱并截取 count 个。
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: uri
          required: true
          schema:
            type: string
          description: |
            推荐来源目录 URI，必须使用 `cloudreve://` 协议格式。我的文件根目录为
            `cloudreve://my/`。
        - in: query
          name: count
          schema:
            type: integer
            default: 10
          description: 推荐数量，默认 10
        - in: query
          name: download
          schema:
            type: boolean
          description: 下载模式（影响 Content-Disposition），默认 false 为预览模式
        - in: query
          name: no_cache
          schema:
            type: boolean
      responses:
        '200':
          description: 随机推荐的文件列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties:
                      data:
                        $ref: '#/components/schemas/FileRecommendResponse'

